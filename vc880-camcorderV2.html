<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0d">
<title>VC-880 Camcorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
/* ==========================================================================
   VC-880 VIDEO CAMERA RECORDER
   Body plastic + recessed LCD + burned-in OSD + blue setup menu.
   UI stays crisp; only the picture is analog.
   ========================================================================== */
:root{
  --body-hi:#3a3d41; --body:#26282b; --body-lo:#1a1c1e; --body-deep:#0f1011;
  --etch:#4a4e53; --label:#a6abb0; --label-dim:#6d7277;
  --osd:#eef1ec; --osd-dim:#b9c0b8;
  --amber:#d8922c; --tape:#8fb35c; --rec:#cf2f22; --rec-hi:#e8493a;
  --menu-bg:#08131f; --menu-line:#1d3d58; --menu-txt:#d4e4f2; --menu-sel:#0e4f86;
  --tap:44px;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; background:#000; overscroll-behavior:none; }
body{
  font-family:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  color:var(--label); overflow:hidden; touch-action:manipulation;
  user-select:none; -webkit-user-select:none;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

#app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#1e2023 0%,#141517 40%,#0d0e0f 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------------- viewfinder ---------------- */
#vf{
  position:relative; flex:1 1 auto; min-height:0; margin:6px 6px 0;
  border-radius:4px; background:#000; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 1px #000, inset 0 0 0 3px #202225,
             inset 0 0 14px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05);
}
#vf.ratio43 .screen{ aspect-ratio:3/4; width:auto; height:100%; max-width:100%; }
@media (orientation:landscape){ #vf.ratio43 .screen{ aspect-ratio:4/3; height:100%; width:auto; max-height:100%; } }
.screen{ position:relative; width:100%; height:100%; background:#000; overflow:hidden; }
#out{ display:block; width:100%; height:100%; object-fit:cover; background:#000; }
#pbvid,#pbimg{ display:none; width:100%; height:100%; object-fit:cover; background:#000; }
body.mode-play #out{ display:none; }
body.mode-play.pb-video #pbvid{ display:block; }
body.mode-play.pb-photo #pbimg{ display:block; }

.glass{
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:.75;
  background:radial-gradient(130% 80% at 50% -12%, rgba(255,255,255,.05), rgba(255,255,255,0) 55%);
}
.tapeline{
  position:absolute; inset:0; pointer-events:none; display:none; opacity:.55;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.32) 0 1px, rgba(0,0,0,0) 1px 3px);
}
body.mode-play.pb-video .tapeline{ display:block; }

/* ---------------- HUD (crisp DOM) ---------------- */
.hud{ position:absolute; inset:0; pointer-events:none; z-index:5; }
#zoombar{
  position:absolute; left:3.8%; top:15%;
  opacity:0; transform:translateY(-3px);
  transition:opacity .2s linear, transform .2s ease-out;
}
#zoombar.on{ opacity:1; transform:none; }
.zwrap{
  display:flex; align-items:center; gap:7px;
  font-family:"Roboto Mono",ui-monospace,monospace; font-weight:700;
  font-size:clamp(9px,2.6vmin,13px); letter-spacing:.06em; color:var(--osd);
  text-shadow:1px 1px 0 rgba(0,0,0,.95);
}
.zseg{ display:flex; gap:2px; }
.zseg i{ width:clamp(4px,1.1vmin,6px); height:clamp(8px,2.2vmin,12px);
  background:rgba(255,255,255,.16); box-shadow:0 0 0 1px rgba(0,0,0,.85); }
.zseg i.f{ background:var(--osd); }
.zseg i.t{ background:var(--amber); }

#warns{ position:absolute; left:3.8%; bottom:14%; display:flex; flex-direction:column; gap:4px; }
.warn{
  font-family:"Roboto Mono",monospace; font-weight:700; letter-spacing:.1em;
  font-size:clamp(8px,2.2vmin,11px); color:var(--osd); text-shadow:1px 1px 0 rgba(0,0,0,.95);
}
.warn.amber{ color:var(--amber); }
.warn.blink{ animation:blink 1.1s steps(1,end) infinite; }
@keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:.08} }

#reticle{ position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; opacity:0; }
#reticle.go{ animation:retIn .62s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes retIn{
  0%{opacity:0;transform:scale(1.45)} 18%{opacity:1;transform:scale(1.07)}
  48%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1)}
}
#reticle b{ position:absolute; width:16px; height:16px; border:2px solid var(--osd);
  filter:drop-shadow(1px 1px 0 rgba(0,0,0,.9)); }
#reticle b:nth-child(1){ left:0; top:0; border-right:0; border-bottom:0; }
#reticle b:nth-child(2){ right:0; top:0; border-left:0; border-bottom:0; }
#reticle b:nth-child(3){ left:0; bottom:0; border-right:0; border-top:0; }
#reticle b:nth-child(4){ right:0; bottom:0; border-left:0; border-top:0; }
#reticle s{ position:absolute; left:50%; bottom:-17px; transform:translateX(-50%);
  text-decoration:none; font-family:"Roboto Mono",monospace; font-size:10px; font-weight:700;
  letter-spacing:.14em; color:var(--osd); text-shadow:1px 1px 0 rgba(0,0,0,.9); }
#reticle.lock b{ border-color:var(--amber); }
#reticle.lock s{ color:var(--amber); }

#flash{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); opacity:0;
  font-family:"Roboto Mono",monospace; font-weight:700; letter-spacing:.24em;
  font-size:clamp(13px,4vmin,20px); color:var(--osd); text-shadow:2px 2px 0 rgba(0,0,0,.95);
  white-space:nowrap;
}
#flash.go{ animation:flashIn .95s ease-out forwards; }
@keyframes flashIn{ 0%{opacity:0} 12%{opacity:1} 68%{opacity:1} 100%{opacity:0} }

/* ---------------- deck ---------------- */
#deck{
  flex:0 0 auto; position:relative;
  padding:10px 12px calc(8px + env(safe-area-inset-bottom)/3);
  display:flex; flex-direction:column; gap:9px;
  background:linear-gradient(180deg,var(--body-hi) 0,var(--body) 3px,var(--body) 55%,var(--body-lo) 100%);
  border-top:1px solid #000; transition:opacity .5s linear;
}
#deck::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,.025) 1px 3px);
}
body.idle #deck{ opacity:.6; }
.rowA{ display:flex; align-items:center; gap:12px; }
.rowB{ display:flex; align-items:stretch; gap:8px; }

.rocker{
  flex:1 1 auto; min-width:0; height:56px; position:relative; border-radius:28px;
  background:linear-gradient(180deg,#34373b,#1c1e20); display:flex; overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 4px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.6);
  transition:transform .09s ease-out;
}
.rocker.tw{ transform:rotate(-1.1deg); }
.rocker.tt{ transform:rotate(1.1deg); }
.rocker button{
  flex:1 1 50%; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:13px; font-weight:700; letter-spacing:.16em; color:var(--label);
  transition:background .07s linear, color .07s linear, transform .07s ease-out;
}
.rocker button.dn,.rocker button:active{ background:rgba(0,0,0,.42); color:#fff; transform:translateY(1px); }
.rocker .pivot{ position:absolute; left:50%; top:9px; bottom:9px; width:2px; margin-left:-1px;
  background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.25)); box-shadow:1px 0 0 rgba(255,255,255,.07); }
.rocker .cap{ font-family:"Roboto Mono",monospace; font-size:11px; opacity:.72; letter-spacing:.1em; }

#btnRec{
  flex:0 0 auto; width:66px; height:66px; border-radius:50%; position:relative;
  background:radial-gradient(circle at 38% 32%, #e85343 0%, #c22b1f 52%, #8d1a12 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.28), inset 0 -3px 6px rgba(0,0,0,.55),
             0 3px 0 #4c0f0a, 0 5px 9px rgba(0,0,0,.6);
  transition:transform .07s ease-out, box-shadow .07s ease-out, background .18s linear;
}
#btnRec.dn,#btnRec:active{
  transform:translateY(3px);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.5), 0 0 0 #4c0f0a, 0 2px 4px rgba(0,0,0,.6);
}
#btnRec .glyph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"Roboto Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.1em;
  color:rgba(255,255,255,.92); text-shadow:0 1px 1px rgba(0,0,0,.5); }
#btnRec .sq{ width:17px; height:17px; background:#fff; border-radius:2px; display:none; }
body.recording #btnRec{ background:radial-gradient(circle at 38% 32%, #7e2b24 0%, #5d1c16 55%, #3b100c 100%); }
body.recording #btnRec .sq{ display:block; }
body.recording #btnRec .glyph span{ display:none; }
#btnRec[disabled]{ filter:grayscale(.75) brightness(.6); }

.hw{
  flex:1 1 0; min-height:var(--tap); min-width:0; padding:6px 4px; border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:linear-gradient(180deg,#303337,#1d1f22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.55);
  transition:transform .06s ease-out, box-shadow .06s ease-out, color .12s linear;
}
.hw.dn,.hw:active{ transform:translateY(2px); box-shadow:inset 0 2px 4px rgba(0,0,0,.6); color:#fff; }
.hw .ic{ width:20px; height:20px; display:block; }
.hw .tx{ font-size:10px; font-weight:700; letter-spacing:.13em; color:var(--label-dim); }
.hw.on .tx,.hw.on .ic{ color:var(--amber); }

.switch{
  flex:1.35 1 0; min-height:var(--tap); position:relative; border-radius:6px; padding:3px; display:flex;
  background:linear-gradient(180deg,#131416,#202326);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.06);
}
.switch .knob{
  position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:4px;
  background:linear-gradient(180deg,#43474c,#2a2d31);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 1px 3px rgba(0,0,0,.6);
  transition:transform .19s cubic-bezier(.3,1.5,.5,1);
}
body.mode-play .switch .knob{ transform:translateX(100%); }
.switch button{ position:relative; z-index:1; flex:1 1 50%; font-size:10px; font-weight:700;
  letter-spacing:.12em; color:var(--label-dim); }
.switch button.sel{ color:var(--osd); }

.lamp{ width:7px; height:7px; border-radius:50%; background:#2a1a17;
  box-shadow:inset 0 0 2px rgba(0,0,0,.9); transition:background .1s linear; }
body.recording .lamp{ background:var(--rec-hi); box-shadow:0 0 7px 2px rgba(231,73,58,.75);
  animation:blink 1s steps(1,end) infinite; }
.decklabel{ display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:10px; font-weight:700; letter-spacing:.2em; color:var(--label-dim); }

#transport{ display:none; flex-direction:column; gap:9px; }
body.mode-play #transport{ display:flex; }
body.mode-play .camrow{ display:none; }
.tbtns{ display:flex; gap:8px; }

/* ---------------- tape index ---------------- */
#tapeindex{
  display:none; position:absolute; inset:0; z-index:4; overflow:auto;
  -webkit-overflow-scrolling:touch; background:rgba(4,8,12,.94);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 14px;
}
body.mode-play.browsing #tapeindex{ display:block; }
.ix-head{ display:flex; align-items:baseline; justify-content:space-between;
  font-family:"Roboto Mono",monospace; font-size:11px; letter-spacing:.18em; color:var(--tape);
  border-bottom:1px solid var(--menu-line); padding-bottom:7px; margin-bottom:10px; }
.ix-list{ display:flex; flex-direction:column; gap:1px; }
.ix-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 8px; min-height:var(--tap); background:rgba(255,255,255,.02);
  border-left:3px solid transparent; font-family:"Roboto Mono",monospace; font-size:12px; color:var(--menu-txt); }
.ix-item.sel{ background:var(--menu-sel); border-left-color:var(--amber); color:#fff; }
.ix-item .th{ width:52px; height:39px; flex:0 0 auto; background:#000; object-fit:cover; box-shadow:0 0 0 1px #234; }
.ix-item .meta{ flex:1 1 auto; min-width:0; }
.ix-item .meta b{ display:block; font-weight:500; letter-spacing:.08em; }
.ix-item .meta i{ display:block; font-style:normal; font-size:10px; color:#7f97ab; letter-spacing:.1em; margin-top:2px; }
.ix-empty{ font-family:"Roboto Mono",monospace; font-size:12px; color:#6a8398;
  letter-spacing:.1em; padding:22px 4px; line-height:1.8; }

/* ---------------- session ---------------- */
#sessionPill{
  position:absolute; top:3%; left:50%; transform:translateX(-50%);
  pointer-events:auto; display:flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:999px; background:rgba(0,0,0,.55);
  font-family:"Roboto Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.12em;
  color:var(--osd); box-shadow:0 0 0 1px rgba(255,255,255,.14);
  transition:transform .08s ease-out;
}
#sessionPill:active{ transform:translateX(-50%) scale(.94); }
#sessionPill .pdot{ width:6px; height:6px; border-radius:50%; background:var(--tape); box-shadow:0 0 5px rgba(143,179,92,.7); }
body.mode-play #sessionPill, body.menu-open #sessionPill, body.session-open #sessionPill{ display:none; }

#sessionPanel{
  display:none; position:absolute; inset:0; z-index:7; overflow:auto;
  -webkit-overflow-scrolling:touch; background:rgba(4,8,12,.96); flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 14px;
}
body.session-open #sessionPanel{ display:flex; }
.sess-actions{ display:flex; gap:8px; margin:2px 0 10px; }
.sess-actions button{
  flex:1 1 0; min-height:var(--tap); border-radius:6px;
  background:linear-gradient(180deg,#303337,#1d1f22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #0d0e0f, 0 3px 6px rgba(0,0,0,.5);
  font-family:"Roboto Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--osd);
  transition:transform .07s ease-out;
}
.sess-actions button:active{ transform:translateY(2px); }
.sess-actions .sess-saveall{ background:linear-gradient(180deg,#1f4a2e,#123420); color:#d7f5d0; }
.sess-actions button:disabled{ opacity:.55; }
.sess-item{ position:relative; padding-right:8px; }
.sess-row-save{
  margin-left:auto; flex:0 0 auto; padding:7px 12px; border-radius:4px;
  background:linear-gradient(180deg,#14324b,#0c2134); color:#cfe4f6;
  font-family:"Roboto Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.1em;
}
.sess-row-save:active{ transform:translateY(1px); }

/* ---------------- setup menu ---------------- */
#menu{
  position:absolute; inset:0; z-index:6; display:none; flex-direction:column;
  background:linear-gradient(180deg, rgba(8,19,31,.965), rgba(5,12,20,.975));
  color:var(--menu-txt); padding:calc(env(safe-area-inset-top) + 8px) 0 0;
}
body.menu-open #menu{ display:flex; }
.m-head{ display:flex; align-items:center; justify-content:space-between; padding:0 12px 8px;
  border-bottom:1px solid var(--menu-line); font-family:"Roboto Mono",monospace;
  font-size:12px; letter-spacing:.2em; color:#8fc0e8; }
.m-body{ flex:1 1 auto; display:flex; min-height:0; }
.m-tabs{ flex:0 0 98px; border-right:1px solid var(--menu-line); overflow:auto; padding:4px 0; }
.m-tabs button{ display:block; width:100%; text-align:left; padding:11px 10px; min-height:var(--tap);
  font-family:"Roboto Mono",monospace; font-size:11px; letter-spacing:.1em; color:#7fa6c6;
  border-left:3px solid transparent; }
.m-tabs button.sel{ color:#fff; background:var(--menu-sel); border-left-color:var(--amber); }
.m-items{ flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch; padding:4px 0 10px; }
.m-item{ display:block; width:100%; text-align:left; padding:9px 12px; min-height:var(--tap);
  border-left:3px solid transparent; }
.m-item.sel{ background:rgba(14,79,134,.55); border-left-color:var(--amber); }
.m-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.m-name{ font-family:"Roboto Mono",monospace; font-size:12px; letter-spacing:.09em; }
.m-val{ font-family:"Roboto Mono",monospace; font-size:12px; font-weight:700; color:var(--amber);
  letter-spacing:.06em; white-space:nowrap; }
.m-val.off{ color:#5f7f99; }
.m-bar{ margin-top:6px; height:7px; display:flex; gap:2px; }
.m-bar i{ flex:1 1 0; background:rgba(255,255,255,.1); }
.m-bar i.f{ background:#5fa8e0; }
.m-bar i.f.hot{ background:var(--amber); }
.m-note{ margin-top:5px; font-family:"Roboto Mono",monospace; font-size:10px;
  letter-spacing:.08em; color:#6d8ea8; }
.m-foot{ flex:0 0 auto; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--menu-line); background:rgba(3,9,15,.7); }
.m-foot button{ flex:1 1 0; min-height:var(--tap); border-radius:4px;
  background:linear-gradient(180deg,#14324b,#0c2134); box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  font-family:"Roboto Mono",monospace; font-size:12px; letter-spacing:.14em; color:#cfe4f6;
  display:flex; align-items:center; justify-content:center;
  transition:transform .06s ease-out, background .08s linear; }
.m-foot button:active{ transform:translateY(2px); background:#0a1a29; }

/* ---------------- boot / error ---------------- */
.overlay{ position:absolute; inset:0; z-index:9; display:none; background:#000; color:var(--osd);
  flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:26px; text-align:center; }
.overlay.on{ display:flex; }
#bootWord{ font-weight:700; font-size:clamp(26px,9vmin,44px); letter-spacing:.42em; margin-left:.42em;
  color:var(--osd); text-shadow:0 0 18px rgba(230,240,225,.26); }
#bootSub{ font-family:"Roboto Mono",monospace; font-size:11px; letter-spacing:.3em; color:var(--label-dim); }
.boot-l{ font-family:"Roboto Mono",monospace; font-size:12px; letter-spacing:.26em; color:var(--tape); min-height:18px; }
.pwr{ margin-top:6px; width:118px; height:118px; border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #3c4046, #202326 60%, #121415 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14), inset 0 -4px 10px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.7);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  transition:transform .08s ease-out; }
.pwr:active{ transform:translateY(3px) scale(.985); }
.pwr .ring{ width:34px; height:34px; border:3px solid var(--tape); border-radius:50%; position:relative;
  box-shadow:0 0 12px rgba(143,179,92,.35); }
.pwr .ring::after{ content:""; position:absolute; left:50%; top:-5px; width:3px; height:15px; margin-left:-1.5px;
  background:var(--tape); box-shadow:0 0 10px rgba(143,179,92,.6); }
.pwr .tx{ font-size:11px; font-weight:700; letter-spacing:.2em; color:var(--label); }
.err-title{ font-family:"Roboto Mono",monospace; font-size:14px; font-weight:700; letter-spacing:.24em; color:var(--amber); }
.err-msg{ font-family:"Roboto Mono",monospace; font-size:12px; line-height:1.85; letter-spacing:.06em;
  color:var(--osd-dim); max-width:32ch; }
.err-hint{ font-family:"Roboto Mono",monospace; font-size:10px; line-height:1.8; letter-spacing:.06em;
  color:#6d7277; max-width:36ch; }
.btn-line{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.btn-hard{ min-height:var(--tap); padding:12px 20px; border-radius:6px;
  background:linear-gradient(180deg,#303337,#1d1f22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #0d0e0f, 0 4px 8px rgba(0,0,0,.5);
  font-size:12px; font-weight:700; letter-spacing:.16em; color:var(--osd);
  transition:transform .07s ease-out, box-shadow .07s ease-out; }

<script>
"use strict";
/* =========================================================================
   VC-880 — modules: Store / Beep / FX / OSD / Cam / Zoom / Rec / Play /
   Menu / UI / App. Each owns one concern so effects and controls can be
   changed independently.
   ========================================================================= */

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const pad = (n,l=2) => String(n).padStart(l,"0");
const rnd = (a,b) => a+Math.random()*(b-a);
const body = document.body;
const hms = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/3600)+":"+pad(Math.floor(s/60)%60)+":"+pad(s%60); };
const msf = s => { s=Math.max(0,Math.floor(s)); return pad(Math.floor(s/60))+":"+pad(s%60); };

/* ------------------------------ settings ------------------------------ */
const Store = {
  key:"vc880.settings.v1",
  load(){ try{ const r=localStorage.getItem(this.key); return r?JSON.parse(r):null; }catch(e){ return null; } },
  save(o){ try{ localStorage.setItem(this.key, JSON.stringify(o)); }catch(e){} }
};
const FXDEF = { intensity:0.85, noise:0.55, tracking:0.5, bleed:0.62, aberr:0.45, scan:0.42,
                soft:0.6, sat:1.06, contrast:1.06, warp:0.4, interlace:0.4, dropout:0.35 };
const S = Object.assign({
  wb:0, exposure:0, mirrorFront:1, quality:1, frame:0, tapeMode:0, shoot:0,
  stamp:1, stampFmt:0, showBattery:1, showCounter:1, showRec:1, beeps:1, mic:1
}, FXDEF, Store.load()||{});
const persist = () => Store.save(S);

const State = {
  powered:false, ready:false, mode:"cam", recording:false,
  recStart:0, recElapsed:0, tapeUsed:0, tapeLen:120*60,
  facing:"environment", battery:1, batterySim:0.96, batteryReal:false,
  fps:60, quality:S.quality, micOK:false, recSupported:true,
  lastTouch:performance.now(), idle:false,
  clips:[], sel:-1, playing:false, shuttle:0,
  camCaps:{ zoom:false, focus:false, wb:false, exposure:false }
};

/* -------------------------------- beeps ------------------------------- */
const Beep = {
  ctx:null, recDest:null, micSrc:null, motor:null, motorNodes:null, motorDir:1,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.recDest = this.ctx.createMediaStreamDestination();
    }catch(e){}
  },
  routeMic(stream){
    if(!this.ctx || !this.recDest) return;
    try{ if(this.micSrc){ this.micSrc.disconnect(); this.micSrc=null; } }catch(e){}
    const at = (stream && stream.getAudioTracks) ? stream.getAudioTracks()[0] : null;
    if(!at) return;
    try{
      this.micSrc = this.ctx.createMediaStreamSource(new MediaStream([at]));
      this.micSrc.connect(this.recDest);
    }catch(e){}
  },
  tone(f,dur,vol,type){
    if(!S.beeps||!this.ctx) return;
    try{
      const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||"square"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.03,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  },
  click(){ this.tone(1500,0.03,0.012); },
  start(){ this.tone(980,0.09,0.03); setTimeout(()=>this.tone(1320,0.11,0.03),95); },
  stop(){ this.tone(760,0.14,0.026); },
  err(){ this.tone(300,0.22,0.03,"sawtooth"); },
  // Zoom motor: low gear rumble + a higher servo "whine" + filtered mechanical
  // noise, based on how real camcorder zoom/focus servos are described (a
  // high-pitched electronic whine layered over gear noise, pitch tracking
  // motor speed). Routed to both the speakers (live monitoring) and the
  // recorder's mixed audio bus, so it ends up baked into saved clips too.
  motorOn(dir){
    if(dir!==undefined) this.motorDir = dir;
    if(this.motor || !this.ctx || !S.beeps) return;
    try{
      const t=this.ctx.currentTime;
      const rumble=this.ctx.createOscillator(), rumbleF=this.ctx.createBiquadFilter(), rumbleG=this.ctx.createGain();
      rumble.type="sawtooth"; rumble.frequency.value=92;
      rumbleF.type="lowpass"; rumbleF.frequency.value=380;
      rumbleG.gain.setValueAtTime(0.0001,t); rumbleG.gain.exponentialRampToValueAtTime(0.006,t+0.15);
      rumble.connect(rumbleF).connect(rumbleG);

      const whine=this.ctx.createOscillator(), whineG=this.ctx.createGain();
      whine.type="sine"; whine.frequency.value = this.motorDir>=0 ? 1080 : 930;
      whineG.gain.setValueAtTime(0.0001,t); whineG.gain.exponentialRampToValueAtTime(0.009,t+0.12);
      whine.connect(whineG);

      const buf=this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate*0.4), this.ctx.sampleRate);
      const bd=buf.getChannelData(0); for(let i=0;i<bd.length;i++) bd[i]=Math.random()*2-1;
      const noise=this.ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
      const noiseF=this.ctx.createBiquadFilter(); noiseF.type="bandpass"; noiseF.frequency.value=1300; noiseF.Q.value=0.8;
      const noiseG=this.ctx.createGain(); noiseG.gain.setValueAtTime(0.0001,t); noiseG.gain.exponentialRampToValueAtTime(0.0035,t+0.15);
      noise.connect(noiseF).connect(noiseG);

      const bus=this.ctx.createGain();
      rumbleG.connect(bus); whineG.connect(bus); noiseG.connect(bus);
      bus.connect(this.ctx.destination);
      if(this.recDest) bus.connect(this.recDest);
      rumble.start(); whine.start(); noise.start();
      this.motor=rumble;
      this.motorNodes={rumble,rumbleG,whine,whineG,noise,noiseG,bus};
    }catch(e){}
  },
  motorOff(){
    if(!this.motor||!this.motorNodes) return;
    const {rumble,rumbleG,whine,whineG,noise,noiseG}=this.motorNodes;
    try{
      const t=this.ctx.currentTime;
      [rumbleG,whineG,noiseG].forEach(g=>{
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(Math.max(0.0001,g.gain.value), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
      });
      rumble.stop(t+0.16); whine.stop(t+0.16); noise.stop(t+0.16);
    }catch(e){}
    this.motor=null; this.motorNodes=null;
  },
  motorRate(r){
    if(!this.motor||!this.motorNodes) return;
    try{
      const t=this.ctx.currentTime;
      this.motorNodes.rumble.frequency.setTargetAtTime(78+r*46, t, 0.08);
      const base=this.motorDir>=0?1080:930;
      this.motorNodes.whine.frequency.setTargetAtTime(base+r*260, t, 0.06);
    }catch(e){}
  }
};

/* ===================== FX — WebGL analog video path ==================== */
const FX = (() => {
  const cv = document.createElement("canvas");
  let gl=null, prog=null, tex=null, ok=false; const loc={};

  const VS = "attribute vec2 aPos; varying vec2 vUV;" +
             "void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }";

  const FS = [
  "#ifdef GL_FRAGMENT_PRECISION_HIGH",
  "precision highp float;",
  "#else",
  "precision mediump float;",
  "#endif",
  "varying vec2 vUV;",
  "uniform sampler2D uTex;",
  "uniform vec2 uTexScale, uTexOffset, uRes;",
  "uniform float uTime, uZoom, uMirror, uField;",
  "uniform float uInt, uNoise, uTrackAmt, uBleed, uAberr, uScan, uSoft;",
  "uniform float uSat, uCon, uWarp, uInter, uDrop, uTrack, uTrackY, uExp;",
  "uniform vec3 uWBGain;",
  "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453123); }",
  "vec3 rgb2yiq(vec3 c){ return vec3(dot(c,vec3(0.299,0.587,0.114)), dot(c,vec3(0.596,-0.274,-0.322)), dot(c,vec3(0.211,-0.523,0.312))); }",
  "vec3 yiq2rgb(vec3 c){ return vec3(c.x+0.956*c.y+0.621*c.z, c.x-0.272*c.y-0.647*c.z, c.x-1.106*c.y+1.703*c.z); }",
  "vec3 samp(vec2 f){ vec2 t = clamp(f,0.0,1.0)*uTexScale + uTexOffset; return texture2D(uTex,t).rgb; }",
  "void main(){",
  "  vec2 uv = vUV;",
  "  if(uMirror > 0.5) uv.x = 1.0 - uv.x;",
  "  uv = (uv - 0.5)/uZoom + 0.5;",                       // digital zoom
  "  float t = uTime; float px = 1.0/uRes.x;",
  "  float sy = vUV.y;",                                   // raster line on the display
  "  float wob = sin(sy*7.0 + t*0.9)*0.0016 + sin(sy*103.0 - t*2.7)*0.0005;",
  "  uv.x += wob*uWarp*uInt;",                             // tape warp
  "  float band = smoothstep(0.075,0.0,abs(sy-uTrackY))*uTrack;",
  "  uv.x += band*(hash(vec2(floor(sy*200.0), floor(t*26.0)))-0.5)*0.10*uTrackAmt;",
  "  float hs = smoothstep(0.014,0.0,sy);",                // head-switching strip, frame bottom
  "  uv.x += hs*(hash(vec2(floor(sy*400.0), floor(t*30.0)))-0.5)*0.09*uInt;",
  "  float ab = uAberr*uInt*2.4*px*(1.0 + length(uv-0.5)*2.2);",
  "  vec3 c;",
  "  c.r = samp(uv + vec2(ab,0.0)).r;",
  "  c.g = samp(uv).g;",
  "  c.b = samp(uv - vec2(ab,0.0)).b;",
  "  float so = uSoft*uInt*px*2.4;",
  "  vec3 bl = (samp(uv+vec2(so,0.0)) + samp(uv-vec2(so,0.0)) + samp(uv+vec2(so*2.2,0.0)) + samp(uv-vec2(so*2.2,0.0)))*0.25;",
  "  c = mix(c, bl, 0.55*uSoft);",                         // horizontal softness
  "  vec3 y0 = rgb2yiq(c);",
  "  float bk = 1.0 + uBleed*7.0;",
  "  vec2 ch = rgb2yiq(samp(uv - vec2(px*1.5*bk,0.0))).yz + rgb2yiq(samp(uv - vec2(px*3.5*bk,0.0))).yz + rgb2yiq(samp(uv - vec2(px*6.0*bk,0.0))).yz;",
  "  ch = (ch + y0.yz)*0.25;",
  "  float dr = (hash(vec2(floor(t*3.0), 7.3))-0.5)*0.10*uInt;",
  "  float cs = cos(dr), sn = sin(dr);",
  "  vec2 cm = mix(y0.yz, ch, uBleed);",
  "  cm = vec2(cm.x*cs - cm.y*sn, cm.x*sn + cm.y*cs);",    // slow hue drift
  "  c = yiq2rgb(vec3(y0.x, cm));",
  "  c *= uWBGain * uExp;",
  "  c = max(c - 0.018*uInt, 0.0)/(1.0 - 0.018*uInt);",    // crushed blacks
  "  c = c/(1.0 + max(c-0.82,0.0)*1.35);",                 // highlight knee
  "  float l = dot(c, vec3(0.299,0.587,0.114));",
  "  c = mix(vec3(l), c, uSat);",
  "  c = (c-0.5)*uCon + 0.5;",
  "  float n = hash(vUV*uRes + vec2(t*61.3, t*37.7));",
  "  float nl = dot(c, vec3(0.299,0.587,0.114));",
  "  c += (n-0.5)*uNoise*uInt*(0.085 + 0.20*(1.0-nl));",   // grain, mostly in shadows
  "  c += band*0.10*uTrackAmt + hs*(n-0.4)*0.5;",
  "  float row = floor(sy*240.0); float slot = floor(t*14.0);",
  "  float on = step(1.0 - uDrop*0.020, hash(vec2(row,slot)));",
  "  float dx = hash(vec2(row, slot+31.0));",
  "  float seg = step(dx, uv.x)*step(uv.x, dx + 0.02 + 0.06*hash(vec2(row,slot+57.0)));",
  "  c = mix(c, vec3(0.92,0.94,0.90), on*seg*0.75);",      // dropouts
  "  c *= 1.0 - uScan*0.13*(0.5 + 0.5*sin(sy*240.0*6.2831853));",
  "  c *= 1.0 - uInter*0.085*mod(row + uField, 2.0);",     // field structure
  "  float v = length((vUV-0.5)*vec2(1.06,1.0));",
  "  c *= 1.0 - 0.42*uInt*pow(clamp(v,0.0,1.0), 2.6);",
  "  gl_FragColor = vec4(clamp(c,0.0,1.0),1.0);",
  "}"].join("\n");

  function sh(type,src){
    const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.warn("shader:",gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function init(){
    try{
      gl = cv.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,
        preserveDrawingBuffer:false,powerPreference:"high-performance"}) || cv.getContext("experimental-webgl");
    }catch(e){ gl=null; }
    if(!gl) return false;
    const v=sh(gl.VERTEX_SHADER,VS), f=sh(gl.FRAGMENT_SHADER,FS);
    if(!v||!f) return false;
    prog=gl.createProgram(); gl.attachShader(prog,v); gl.attachShader(prog,f); gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(prog,"aPos");
    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
    ["uTex","uTexScale","uTexOffset","uRes","uTime","uZoom","uMirror","uField","uInt","uNoise",
     "uTrackAmt","uBleed","uAberr","uScan","uSoft","uSat","uCon","uWarp","uInter","uDrop",
     "uTrack","uTrackY","uExp","uWBGain"].forEach(n=>loc[n]=gl.getUniformLocation(prog,n));
    tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    ok=true; return true;
  }
  const WB=[[1,1,1],[1.07,1.0,0.90],[1.12,1.01,0.86],[0.90,0.98,1.16],[0.86,0.97,1.22]];
  function draw(video,w,h,t,zoom,mirror,field,track,trackY){
    if(!ok||!video||video.readyState<2||!video.videoWidth) return false;
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    gl.viewport(0,0,w,h);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video); }catch(e){ return false; }
    const va=video.videoWidth/video.videoHeight, ca=w/h;
    let sx=1,sy=1,ox=0,oy=0;
    if(va>ca){ sx=ca/va; ox=(1-sx)/2; } else { sy=va/ca; oy=(1-sy)/2; }
    gl.uniform1i(loc.uTex,0);
    gl.uniform2f(loc.uTexScale,sx,sy); gl.uniform2f(loc.uTexOffset,ox,oy);
    gl.uniform2f(loc.uRes,w,h);
    gl.uniform1f(loc.uTime,t); gl.uniform1f(loc.uZoom,zoom);
    gl.uniform1f(loc.uMirror,mirror?1:0); gl.uniform1f(loc.uField,field);
    gl.uniform1f(loc.uInt,S.intensity); gl.uniform1f(loc.uNoise,S.noise);
    gl.uniform1f(loc.uTrackAmt,S.tracking); gl.uniform1f(loc.uBleed,S.bleed);
    gl.uniform1f(loc.uAberr,S.aberr); gl.uniform1f(loc.uScan,S.scan);
    gl.uniform1f(loc.uSoft,S.soft); gl.uniform1f(loc.uSat,S.sat);
    gl.uniform1f(loc.uCon,S.contrast); gl.uniform1f(loc.uWarp,S.warp);
    gl.uniform1f(loc.uInter,S.interlace); gl.uniform1f(loc.uDrop,S.dropout);
    gl.uniform1f(loc.uTrack,track); gl.uniform1f(loc.uTrackY,trackY);
    gl.uniform1f(loc.uExp, State.camCaps.exposure ? 1.0 : Math.pow(2,S.exposure*0.30));
    const g = State.camCaps.wb ? WB[0] : (WB[S.wb]||WB[0]);
    gl.uniform3f(loc.uWBGain,g[0],g[1],g[2]);
    gl.drawArrays(gl.TRIANGLES,0,3);
    return true;
  }
  return { init, draw, canvas:cv, get ok(){ return ok; } };
})();

/* ============ OSD — characters burned into the picture ================= */
const OSD = {
  months:["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],
  text(x,y,str,size,align,color){
    const c=this.ctx;
    c.font = "700 "+size+'px "Roboto Mono", ui-monospace, monospace';
    c.textAlign = align||"left"; c.textBaseline="alphabetic";
    const o = Math.max(1,size*0.08);
    c.fillStyle="rgba(0,0,0,.75)"; c.fillText(str,x+o,y+o);
    c.fillStyle=color||"#eef1ec"; c.fillText(str,x,y);
  },
  battery(x,y,s,level,now){
    const c=this.ctx, w=s*2.05, h=s, lw=Math.max(1,s*0.1);
    c.save(); c.lineWidth=lw;
    c.strokeStyle="rgba(0,0,0,.7)"; c.strokeRect(x+1,y+1,w,h);
    c.fillStyle="rgba(0,0,0,.6)"; c.fillRect(x+w+1,y+h*0.28+1,s*0.22,h*0.44);
    c.strokeStyle="#eef1ec"; c.strokeRect(x,y,w,h);
    c.fillStyle="#eef1ec"; c.fillRect(x+w,y+h*0.28,s*0.22,h*0.44);
    const gap=s*0.13, iw=(w-gap*4)/3;
    const lit = level>0.66?3 : level>0.36?2 : level>0.12?1 : 0;
    for(let i=0;i<lit;i++){
      c.fillStyle = level<=0.12 ? "#cf2f22" : "#eef1ec";
      c.fillRect(x+gap+i*(iw+gap), y+gap, iw, h-gap*2);
    }
    if(lit===0 && Math.floor(now/420)%2===0){ c.fillStyle="#cf2f22"; c.fillRect(x+gap,y+gap,iw,h-gap*2); }
    c.restore();
  },
  dot(x,y,r,on){
    const c=this.ctx;
    c.beginPath(); c.arc(x+1,y+1,r,0,6.2832); c.fillStyle="rgba(0,0,0,.6)"; c.fill();
    c.beginPath(); c.arc(x,y,r,0,6.2832); c.fillStyle= on?"#e8493a":"rgba(255,255,255,.16)"; c.fill();
  },
  stampLines(d){
    const M=this.months;
    if(S.stampFmt===1) return [pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear(),
                               pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())];
    if(S.stampFmt===2) return [d.getFullYear()+" "+M[d.getMonth()]+" "+pad(d.getDate()),
                               pad(d.getHours())+":"+pad(d.getMinutes())];
    let h=d.getHours(), ap=h>=12?"PM":"AM"; h%=12; if(h===0) h=12;
    return [M[d.getMonth()]+" "+pad(d.getDate())+" "+d.getFullYear(), pad(h)+":"+pad(d.getMinutes())+" "+ap];
  },
  draw(ctx,w,h,now){
    this.ctx=ctx;
    const s=Math.max(11,Math.round(h*0.031));
    const px=Math.round(w*0.055), py=Math.round(h*0.055);
    const blink=Math.floor(now/500)%2===0;
    let x=px;
    if(S.showBattery){ this.battery(x,py,s*0.82,State.battery,now); x+=s*2.6; }
    if(S.showRec){
      if(State.recording){
        this.dot(x+s*0.36,py+s*0.42,s*0.34,blink);
        this.text(x+s*0.98,py+s*0.78,"REC",s,"left","#eef1ec");
      }else{
        this.dot(x+s*0.36,py+s*0.42,s*0.34,false);
        this.text(x+s*0.98,py+s*0.78,State.idle?"STANDBY":"PAUSE",s,"left","#b9c0b8");
      }
    }
    const tm=["SP","LP","EP"][S.tapeMode]||"SP";
    this.text(w-px,py+s*0.78,tm,s,"right","#eef1ec");
    this.text(w-px,py+s*2.05,msf(Math.max(0,State.tapeLen-State.tapeUsed-(State.recording?State.recElapsed:0)))+" REM",
              s*0.8,"right","#b9c0b8");
    if(S.showCounter){
      this.text(px,h-py,hms(State.recording?State.recElapsed:State.tapeUsed),s*1.05,"left","#eef1ec");
    }
    if(S.stamp){
      const L=this.stampLines(new Date());
      this.text(w-px,h-py-s*1.3,L[0],s,"right","#eef1ec");
      this.text(w-px,h-py,L[1],s,"right","#eef1ec");
    }
  }
};

/* ============================ CAM ===================================== */
const Cam = {
  stream:null, video:null, track:null, caps:{},
  async start(facing){
    this.stop();
    const v = this.video || document.createElement("video");
    v.playsInline=true; v.muted=true;
    v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
    this.video=v;
    const size = State.quality ? {width:{ideal:1280},height:{ideal:960}} : {width:{ideal:640},height:{ideal:480}};
    const base = Object.assign({ facingMode:{ideal:facing}, frameRate:{ideal:30} }, size);
    const audio = S.mic ? {echoCancellation:false,noiseSuppression:false,autoGainControl:true} : false;
    const tries = [ {video:base,audio}, {video:base,audio:false}, {video:{facingMode:facing},audio:false}, {video:true,audio:false} ];
    let stream=null, lastErr=null;
    for(const t of tries){
      try{ stream = await navigator.mediaDevices.getUserMedia(t);
           State.micOK = !!(t.audio && stream.getAudioTracks().length); break; }
      catch(e){ lastErr=e; }
    }
    if(!stream) throw lastErr || new Error("no stream");
    this.stream=stream; this.track=stream.getVideoTracks()[0];
    v.srcObject=stream;
    try{ await v.play(); }catch(e){}
    this.caps = (this.track && this.track.getCapabilities) ? (this.track.getCapabilities()||{}) : {};
    State.camCaps.zoom = !!this.caps.zoom;
    State.camCaps.focus = !!(this.caps.focusMode || this.caps.pointsOfInterest);
    State.camCaps.wb = !!(this.caps.whiteBalanceMode && this.caps.colorTemperature);
    State.camCaps.exposure = !!this.caps.exposureCompensation;
    try{ Beep.routeMic(stream); }catch(e){}
    return stream;
  },
  async focusAt(nx,ny){
    if(!this.track||!this.track.applyConstraints) return false;
    const adv=[];
    if(this.caps.pointsOfInterest) adv.push({pointsOfInterest:[{x:nx,y:ny}]});
    if(this.caps.focusMode && this.caps.focusMode.indexOf("single-shot")>=0) adv.push({focusMode:"single-shot"});
    else if(this.caps.focusMode && this.caps.focusMode.indexOf("continuous")>=0) adv.push({focusMode:"continuous"});
    if(!adv.length) return false;
    try{ await this.track.applyConstraints({advanced:adv}); return true; }catch(e){ return false; }
  },
  async applyWB(){
    if(!this.track||!this.track.applyConstraints||!State.camCaps.wb) return false;
    const temps=[null,5600,6800,4300,3000], r=this.caps.colorTemperature;
    try{
      if(S.wb===0) await this.track.applyConstraints({advanced:[{whiteBalanceMode:"continuous"}]});
      else await this.track.applyConstraints({advanced:[{whiteBalanceMode:"manual",
             colorTemperature: clamp(temps[S.wb], r.min, r.max)}]});
      return true;
    }catch(e){ return false; }
  },
  async applyExposure(){
    if(!this.track||!this.track.applyConstraints||!State.camCaps.exposure) return false;
    try{
      const r=this.caps.exposureCompensation, mid=(r.min+r.max)/2;
      await this.track.applyConstraints({advanced:[{exposureMode:"continuous",
        exposureCompensation: clamp(mid + (S.exposure/3)*(r.max-mid), r.min, r.max)}]});
      return true;
    }catch(e){ return false; }
  },
  stop(){ if(this.stream) this.stream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} }); this.stream=null; this.track=null; }
};

/* ===================== ZOOM — slow mechanical rocker =================== */
const Zoom = {
  minL:0, maxL:3, L:0, targetL:null,
  dir:0, speed:0, lastDir:1, kick:0,
  MAXSPD:0.52, ACC:0.95, DEC:2.6,
  press(d){ if(this.dir===0){ this.kick=0.16; Beep.motorOn(d); } else { Beep.motorDir=d; } this.dir=d; this.lastDir=d; },
  release(){ this.dir=0; Beep.motorOff(); },
  pinch(l){ this.targetL = clamp(l,this.minL,this.maxL); },
  update(dt){
    if(this.targetL!==null){
      this.L += (this.targetL-this.L)*Math.min(1,dt*7.5);
      if(Math.abs(this.targetL-this.L)<0.0015){ this.L=this.targetL; this.targetL=null; }
      this.speed=0; return true;
    }
    if(this.dir!==0){
      this.speed = Math.min(this.MAXSPD, this.speed + this.ACC*dt);
      let step = this.speed*dt;
      if(this.kick>0){ step *= (1 - this.kick*2.2); this.kick=Math.max(0,this.kick-dt*1.4); }
      const before=this.L;
      this.L = clamp(this.L + this.dir*step, this.minL, this.maxL);
      Beep.motorRate(this.speed/this.MAXSPD);
      return this.L!==before;
    }
    if(this.speed>0){
      this.speed = Math.max(0, this.speed - this.DEC*dt);
      this.L = clamp(this.L + this.lastDir*this.speed*dt, this.minL, this.maxL);
      return true;
    }
    return false;
  },
  get x(){ return Math.pow(2,this.L); }
};

/* ============================ REC ===================================== */
const Rec = {
  rec:null, chunks:[], mime:"", startedAt:0, usedGate:false,
  supported(){ return typeof MediaRecorder!=="undefined" && !!HTMLCanvasElement.prototype.captureStream; },
  pickMime(){
    if(typeof MediaRecorder==="undefined") return "";
    const list=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus","video/webm;codecs=vp8","video/webm"];
    for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
    return "";
  },
  start(canvas){
    if(!this.supported()) return false;
    try{
      const cs = canvas.captureStream(30);
      const tracks = cs.getVideoTracks();
      // Mixed audio bus: mic (if enabled) + zoom motor sfx, so the zoom
      // sound is actually baked into the saved clip, not just heard live.
      if(Beep.recDest){ Beep.recDest.stream.getAudioTracks().forEach(t=>tracks.push(t)); }
      else if(Cam.stream && S.mic){ Cam.stream.getAudioTracks().forEach(t=>tracks.push(t)); }
      this.mime = this.pickMime();
      const opts = { videoBitsPerSecond: State.quality?3200000:1600000 };
      if(this.mime) opts.mimeType = this.mime;
      this.rec = new MediaRecorder(new MediaStream(tracks), opts);
      this.chunks=[];
      this.rec.ondataavailable = e => { if(e.data && e.data.size) this.chunks.push(e.data); };
      this.rec.onstop = () => this.finish();
      this.rec.onerror = () => {
        UI.err("RECORDER FAULT","THE TAPE TRANSPORT STOPPED","The browser ended the recording. Everything up to this point was kept on the tape.");
        App.abortRec();
      };
      this.rec.start(1000);
      this.startedAt = performance.now();
      return true;
    }catch(e){ return false; }
  },
  stop(){ try{ if(this.rec && this.rec.state!=="inactive"){ this.rec.stop(); return; } }catch(e){} this.finish(); },
  finish(){
    const dur=(performance.now()-this.startedAt)/1000;
    const chunks=this.chunks; this.chunks=[]; const r=this.rec; this.rec=null;
    const gate=this.usedGate; this.usedGate=false;
    if(!chunks.length) return;
    const type=(this.mime||"video/webm").split(";")[0];
    const blob=new Blob(chunks,{type});
    Play.add({ kind:"video", blob, url:URL.createObjectURL(blob), dur,
               at:new Date(), thumb:UI.grabThumb(gate?App.gateCanvas:null), ext:type.indexOf("mp4")>=0?"mp4":"webm" });
  }
};

/* ============================ PLAY ==================================== */
const Play = {
  add(clip){ State.clips.unshift(clip); State.sel=0; this.renderIndex(); Session.render(); },
  renderIndex(){
    const list=$("#ixList"), n=State.clips.length;
    $("#ixCount").textContent = pad(n)+(n===1?" CLIP":" CLIPS");
    if(!n){ list.innerHTML='<div class="ix-empty">TAPE IS BLANK.<br>SLIDE TO CAMERA AND PRESS REC.</div>'; return; }
    list.innerHTML="";
    State.clips.forEach((c,i)=>{
      const b=document.createElement("button");
      b.className="ix-item"+(i===State.sel?" sel":"");
      const d=c.at;
      b.innerHTML='<img class="th" alt="" src="'+(c.thumb||"")+'">'+
        '<span class="meta"><b>'+pad(n-i)+"&nbsp;&nbsp;"+(c.kind==="video"?hms(c.dur):"STILL")+'</b>'+
        '<i>'+pad(d.getMonth()+1)+"/"+pad(d.getDate())+"&nbsp;&nbsp;"+pad(d.getHours())+":"+pad(d.getMinutes())+
        "&nbsp;&nbsp;"+(c.kind==="video"?String(c.ext||"").toUpperCase():"JPG")+'</i></span>';
      b.addEventListener("click",()=>{ State.sel=i; this.renderIndex(); this.load(i);
        body.classList.remove("browsing"); Beep.click(); });
      list.appendChild(b);
    });
  },
  load(i){
    const c=State.clips[i]; if(!c) return;
    const v=$("#pbvid"), im=$("#pbimg");
    body.classList.remove("pb-video","pb-photo");
    if(c.kind==="video"){
      v.src=c.url; v.currentTime=0; v.playbackRate=1;
      body.classList.add("pb-video");
      State.playing=false; this.toggle(true);
    }else{
      im.src=c.url; body.classList.add("pb-photo"); UI.flash("STILL");
    }
    UI.syncTransport();
  },
  toggle(forcePlay){
    const c=State.clips[State.sel]; if(!c||c.kind!=="video") return;
    const v=$("#pbvid");
    if(forcePlay===true || v.paused){
      v.playbackRate=1; State.shuttle=0; v.play().catch(()=>{}); State.playing=true; UI.flash("PLAY");
    }else{ v.pause(); State.playing=false; UI.flash("PAUSE"); }
    UI.syncTransport();
  },
  stop(){ const v=$("#pbvid"); v.pause(); v.currentTime=0; v.playbackRate=1;
          State.playing=false; State.shuttle=0; UI.flash("STOP"); UI.syncTransport(); },
  shuttle(dir){
    const c=State.clips[State.sel]; if(!c||c.kind!=="video") return;
    const v=$("#pbvid"); State.shuttle=dir;
    if(dir>0){ v.playbackRate=5; if(v.paused) v.play().catch(()=>{}); State.playing=true; UI.flash("FF \u25B6\u25B6"); }
    else { v.pause(); State.playing=false; UI.flash("REW \u25C0\u25C0"); }
    UI.syncTransport();
  },
  shuttleEnd(){ const v=$("#pbvid"); if(State.shuttle>0) v.playbackRate=1; State.shuttle=0; UI.syncTransport(); },
  erase(){
    const c=State.clips[State.sel]; if(!c){ UI.warn("NO CLIP",1500,"amber"); return; }
    try{ URL.revokeObjectURL(c.url); }catch(e){}
    if(c.kind==="video") State.tapeUsed=Math.max(0,State.tapeUsed-c.dur);
    State.clips.splice(State.sel,1);
    State.sel = State.clips.length?0:-1;
    const v=$("#pbvid"); v.pause(); v.removeAttribute("src"); $("#pbimg").removeAttribute("src");
    body.classList.remove("pb-video","pb-photo");
    this.renderIndex();
    Session.updateCount();
    if(State.sel>=0) this.load(State.sel); else body.classList.add("browsing");
    UI.flash("ERASED");
  },
  async save(){
    const c=State.clips[State.sel];
    if(!c){ UI.warn("NO CLIP",1500,"amber"); return; }
    const d=c.at;
    const name="VC880_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+
      pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+"."+(c.kind==="video"?(c.ext||"webm"):"jpg");
    let dl=null;
    try{ dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
    if(dl){
      try{ await dl.save({filename:name, data:c.blob}); UI.flash("SAVED"); return; }
      catch(e){
        if(e && e.code==="declined"){ UI.warn("SAVE CANCELLED",1600,"amber"); return; }
        if(e && (e.code==="rate_limited")){ UI.warn("TRY SAVE AGAIN",1800,"amber"); return; }
      }
    }
    try{
      const a=document.createElement("a"); a.href=c.url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); UI.flash("SAVED");
    }catch(e){ UI.warn("SAVE UNAVAILABLE",2000,"amber"); }
  }
};

/* ============================ SESSION ==================================
   Every clip shot since power-on, browsable without leaving camera mode,
   with a one-tap zip bundle of everything or a save for just one clip. */
const Session = {
  open(){ body.classList.add("session-open"); this.render(); Beep.click(); },
  close(){ body.classList.remove("session-open"); Beep.click(); },
  updateCount(){
    const n=State.clips.length;
    const pill=$("#sessionCount"); if(pill) pill.textContent=n;
    const head=$("#sessionHeadCount"); if(head) head.textContent=pad(n)+(n===1?" CLIP":" CLIPS");
  },
  render(){
    this.updateCount();
    const list=$("#sessList"); if(!list) return;
    const n=State.clips.length;
    if(!n){ list.innerHTML='<div class="ix-empty">NO CLIPS YET THIS SESSION.<br>SWITCH TO CAMERA AND PRESS REC.</div>'; return; }
    list.innerHTML="";
    State.clips.forEach((c,i)=>{
      const row=document.createElement("div");
      row.className="ix-item sess-item";
      const d=c.at;
      row.innerHTML='<img class="th" alt="" src="'+(c.thumb||"")+'">'+
        '<span class="meta"><b>'+pad(n-i)+"&nbsp;&nbsp;"+(c.kind==="video"?hms(c.dur):"STILL")+'</b>'+
        '<i>'+pad(d.getMonth()+1)+"/"+pad(d.getDate())+"&nbsp;&nbsp;"+pad(d.getHours())+":"+pad(d.getMinutes())+
        "&nbsp;&nbsp;"+(c.kind==="video"?String(c.ext||"").toUpperCase():"JPG")+'</i></span>';
      const save=document.createElement("button");
      save.className="sess-row-save"; save.textContent="SAVE";
      save.addEventListener("click",ev=>{ ev.stopPropagation(); this.saveOne(i); });
      row.appendChild(save);
      list.appendChild(row);
    });
  },
  async saveOne(i){
    const c=State.clips[i]; if(!c) return;
    const prev=State.sel; State.sel=i;
    await Play.save();
    State.sel=prev;
  },
  async saveAll(){
    const n=State.clips.length;
    if(!n){ UI.warn("NOTHING TO SAVE",1600,"amber"); return; }
    if(typeof JSZip==="undefined"){ UI.warn("ZIP UNAVAILABLE",2200,"amber"); return; }
    const btn=$("#sessSaveAll");
    if(btn){ btn.disabled=true; btn.textContent="BUNDLING\u2026"; }
    try{
      const zip=new JSZip();
      const ordered=State.clips.slice().reverse();
      ordered.forEach((c,idx)=>{
        const d=c.at;
        const name=pad(idx+1)+"_VC880_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+
          pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+"."+(c.kind==="video"?(c.ext||"webm"):"jpg");
        zip.file(name, c.blob);
      });
      const blob=await zip.generateAsync({ type:"blob", compression:"STORE" });
      const st=new Date();
      const zname="VC880_SESSION_"+st.getFullYear()+pad(st.getMonth()+1)+pad(st.getDate())+"_"+
        pad(st.getHours())+pad(st.getMinutes())+".zip";
      let dl=null;
      try{ dl=(window.claude && window.claude.use)?await window.claude.use("downloads"):null; }catch(e){ dl=null; }
      let saved=false;
      if(dl){
        try{ await dl.save({filename:zname, data:blob}); saved=true; }
        catch(e){ if(e && e.code==="declined"){ UI.warn("SAVE CANCELLED",1600,"amber"); } }
      }
      if(!saved){
        try{
          const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=zname;
          document.body.appendChild(a); a.click(); a.remove(); saved=true;
        }catch(e){}
      }
      if(saved) UI.flash("SAVED");
    }catch(e){
      UI.warn("BUNDLE FAILED",2200,"amber");
    }
    if(btn){ btn.disabled=false; btn.textContent="SAVE ALL (.ZIP)"; }
  }
};

      { k:"soft", label:"SOFTNESS", type:"range", min:0, max:1, step:0.05 },

    ]},
    { name:"AUDIO", items:[
      { k:"mic", label:"MIC", type:"bool",
        note:()=>State.micOK?"AUDIO IS LIVE ON THE TAPE":"NO MICROPHONE ON THIS STREAM",
        apply:()=>App.restartCam() },
      { k:"_in", label:"INPUT", type:"info", val:()=>State.micOK?"BUILT-IN":"OFF" }
    ]},
    { name:"SYSTEM", items:[
      { k:"_batt", label:"POWER", type:"info", val:()=>Math.round(State.battery*100)+"%",
        note:()=>State.batteryReal?"READ FROM THIS DEVICE":"SIMULATED BATTERY PACK" },
      { k:"_fps", label:"FRAME RATE", type:"info", val:()=>Math.round(State.fps)+" FPS" },
      { k:"_lens", label:"LENS", type:"info", val:()=>State.facing==="user"?"FRONT":"REAR" },
      { k:"_reset", label:"RESET ALL SETTINGS", type:"action", run:()=>Menu.resetAll() }
    ]}
  ],
  resetFX(){ Object.assign(S,FXDEF); persist(); this.render(); UI.flash("FX RESET"); },
  resetAll(){ try{ localStorage.removeItem(Store.key); }catch(e){} UI.flash("RESET"); setTimeout(()=>location.reload(),650); },
  open(){ body.classList.add("menu-open"); this.render(); Beep.click(); },
  close(){ body.classList.remove("menu-open"); persist(); Beep.click(); },
  render(){
    const tabs=$("#mTabs"); tabs.innerHTML="";
    this.defs.forEach((d,i)=>{
      const b=document.createElement("button");
      b.textContent=d.name; b.className=i===this.tab?"sel":"";
      b.addEventListener("click",()=>{ this.tab=i; this.item=0; this.render(); Beep.click(); });
      tabs.appendChild(b);
    });
    const host=$("#mItems"); host.innerHTML="";
    const items=this.defs[this.tab].items;
    this.item=clamp(this.item,0,items.length-1);
    items.forEach((it,i)=>{
      const el=document.createElement("button");
      el.className="m-item"+(i===this.item?" sel":"");
      const top=document.createElement("div"); top.className="m-top";
      const nm=document.createElement("span"); nm.className="m-name"; nm.textContent=it.label;
      const vl=document.createElement("span"); vl.className="m-val";
      const v=S[it.k];
      if(it.type==="bool"){ vl.textContent=v?"ON":"OFF"; if(!v) vl.classList.add("off"); }
      else if(it.type==="enum"){ vl.textContent=it.opts[v]||it.opts[0]; }
      else if(it.type==="range"){ vl.textContent= it.fmt? it.fmt(v) : String(Math.round((v-it.min)/(it.max-it.min)*100)); }
      else if(it.type==="info"){ vl.textContent=it.val(); vl.classList.add("off"); }
      else if(it.type==="action"){ vl.textContent="\u25B6"; }
      top.appendChild(nm); top.appendChild(vl); el.appendChild(top);
      if(it.type==="range"){
        const bar=document.createElement("div"); bar.className="m-bar";
        const f=(v-it.min)/(it.max-it.min), n=20;
        for(let k=0;k<n;k++){ const s=document.createElement("i");
          if(k/n<f) s.className="f"+(k/n>0.8?" hot":""); bar.appendChild(s); }
        el.appendChild(bar);
      }
      if(it.note && i===this.item){
        const nt=document.createElement("div"); nt.className="m-note"; nt.textContent=it.note(); el.appendChild(nt);
      }
      el.addEventListener("click",()=>{
        this.item=i;
        if(it.type==="bool"){ S[it.k]=S[it.k]?0:1; it.apply&&it.apply(); persist(); }
        else if(it.type==="action"){ it.run(); return; }
        this.render(); Beep.click();
      });
      if(it.type==="range"){
        let drag=false;
        const setX = ev=>{
          const r=el.getBoundingClientRect();
          const cx=(ev.touches? ev.touches[0].clientX : ev.clientX)-r.left-12;
          const f=clamp(cx/(r.width-24),0,1);
          let nv=Math.round((it.min+f*(it.max-it.min))/it.step)*it.step;
          nv=parseFloat(nv.toFixed(3));
          if(nv!==S[it.k]){ S[it.k]=nv; this.item=i; this.render(); }
        };
        el.addEventListener("touchstart",()=>{ drag=true; this.item=i; },{passive:true});
        el.addEventListener("touchmove",e=>{ if(drag){ e.preventDefault(); setX(e); } },{passive:false});
        el.addEventListener("touchend",()=>{ drag=false; persist(); });
        el.addEventListener("mousedown",e=>{ drag=true; setX(e); });
        const mm=e=>{ if(drag) setX(e); }, mu=()=>{ if(drag){ drag=false; persist(); } };
        window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu);
      }
      host.appendChild(el);
    });
    $("#mHint").textContent=this.defs[this.tab].name;
  },
  move(d){ const n=this.defs[this.tab].items.length; this.item=(this.item+d+n)%n; this.render(); Beep.click(); },
  adjust(d){
    const it=this.defs[this.tab].items[this.item]; if(!it) return;
    if(it.type==="bool") S[it.k]=S[it.k]?0:1;
    else if(it.type==="enum") S[it.k]=(S[it.k]+d+it.opts.length)%it.opts.length;
    else if(it.type==="range") S[it.k]=parseFloat(clamp(S[it.k]+d*it.step,it.min,it.max).toFixed(3));
    else if(it.type==="action"){ if(d>0) it.run(); return; }
    else return;
    it.apply&&it.apply(); persist(); this.render(); Beep.click();
  }
};

/* ============================== UI ==================================== */
const UI = {
  out:null, ctx:null, W:0, H:0, warnEls:{}, zoomTimer:null,
  init(){
    this.out=$("#out");
    this.ctx=this.out.getContext("2d",{alpha:false,desynchronized:true});
    const segs=$("#zsegs"); segs.innerHTML="";
    for(let i=0;i<12;i++) segs.appendChild(document.createElement("i"));
    this.applyFrame(); this.resize(); this.syncZoom();
  },
  applyFrame(){ $("#vf").classList.toggle("ratio43", S.frame===1); this.resize(); },
  resize(){
    if(State.recording) return;                    // keep the capture surface stable mid-take
    const r=$("#screen").getBoundingClientRect();
    if(!r.width||!r.height) return;
    const portrait = r.height >= r.width;
    const base = State.quality===1 ? 512 : 416;    // deliberately low "tape" resolution
    let w,h;
    if(portrait){ h=Math.round(base*4/3); w=Math.round(h*(r.width/r.height)); }
    else { w=Math.round(base*4/3); h=Math.round(w*(r.height/r.width)); }
    w=Math.max(240,Math.round(w/2)*2); h=Math.max(240,Math.round(h/2)*2);
    if(this.out.width!==w||this.out.height!==h){ this.out.width=w; this.out.height=h; }
    this.W=w; this.H=h;
  },
  warn(text,ms,cls){
    const id="w"+text.replace(/\W/g,"");
    let el=this.warnEls[id];
    if(!el){ el=document.createElement("div"); this.warnEls[id]=el; $("#warns").appendChild(el); }
    el.className="warn "+(cls||""); el.textContent=text; el.style.display="block";
    clearTimeout(el._t);
    if(ms) el._t=setTimeout(()=>{ el.style.display="none"; },ms);
  },
  unwarn(text){ const el=this.warnEls["w"+text.replace(/\W/g,"")]; if(el) el.style.display="none"; },
  flash(t){ const f=$("#flash"); f.textContent=t; f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); },
  showZoom(){ const b=$("#zoombar"); b.classList.add("on");
    clearTimeout(this.zoomTimer); this.zoomTimer=setTimeout(()=>b.classList.remove("on"),1500); },
  syncZoom(){
    $("#zval").textContent="\u00D7"+Zoom.x.toFixed(1);
    const segs=$("#zsegs").children, f=(Zoom.L-Zoom.minL)/(Zoom.maxL-Zoom.minL);
    for(let i=0;i<segs.length;i++){
      segs[i].className = (i/segs.length < f) ? (i>=segs.length-3?"t":"f") : "";
    }
  },
  reticle(x,y,locked){
    const r=$("#reticle");
    r.style.left=x+"px"; r.style.top=y+"px";
    r.classList.toggle("lock",!!locked);
    r.querySelector("s").textContent = locked?"AF \u25CF":"AF";
    r.classList.remove("go"); void r.offsetWidth; r.classList.add("go");
  },
  grabThumb(src){
    try{
      const source=src||this.out;
      const c=document.createElement("canvas"); c.width=104; c.height=78;
      c.getContext("2d").drawImage(source,0,0,c.width,c.height);
      return c.toDataURL("image/jpeg",0.6);
    }catch(e){ return ""; }
  },
  err(title,msg,hint){
    $("#errTitle").textContent=title; $("#errMsg").textContent=msg; $("#errHint").textContent=hint||"";
    $("#errScreen").classList.add("on"); Beep.err();
  },
  clearErr(){ $("#errScreen").classList.remove("on"); },
  syncTransport(){
    const c=State.clips[State.sel], dis=!c||c.kind!=="video";
    $("#tPlay").querySelector(".tx").textContent = State.playing?"PAUSE":"PLAY";
    $("#tPlay").classList.toggle("on",State.playing);
    $("#tRew").classList.toggle("on",State.shuttle<0);
    $("#tFF").classList.toggle("on",State.shuttle>0);
    ["#tPlay","#tRew","#tFF","#tStop"].forEach(s=>{ $(s).style.opacity=dis?.4:1; });
  },
  setMode(m){
    if(State.mode===m) return;
    if(State.recording){ this.warn("STOP THE TAPE FIRST",1800,"amber"); return; }
    State.mode=m;
    body.classList.toggle("mode-play",m==="play");
    body.classList.toggle("mode-cam",m==="cam");
    $("#swCam").classList.toggle("sel",m==="cam"); $("#swCam2").classList.toggle("sel",m==="cam");
    $("#swPlay").classList.toggle("sel",m==="play"); $("#swPlay2").classList.toggle("sel",m==="play");
    if(m==="play"){
      Play.renderIndex(); body.classList.add("browsing"); this.syncTransport(); this.flash("VCR");
    }else{
      body.classList.remove("browsing");
      const v=$("#pbvid"); v.pause(); State.playing=false; State.shuttle=0;
      body.classList.remove("pb-video","pb-photo");
      this.flash("CAMERA");
    }
    Beep.click();
  }
};

/* ============================== APP =================================== */
const App = {
  last:0, t0:0, field:0, track:0, trackY:0.5, nextTrack:0,
  frames:0, fpsT:0, slow:0, skipBoot:false, running:false,
  gateCanvas:null, gateCtx:null,

  async boot(){
    Beep.init();
    const el=$("#bootLine");
    $("#btnPower").style.display="none";
    const lines=["SYSTEM CHECK","TAPE \u00B7 OK","HEAD DRUM \u00B7 OK","LENS \u00B7 OK"];
    for(let i=0;i<lines.length;i++){
      el.textContent=lines[i];
      await new Promise(r=>setTimeout(r, this.skipBoot?30:(i===0?250:150)));
    }
    el.textContent="READY";
    await new Promise(r=>setTimeout(r, this.skipBoot?40:250));
    $("#boot").classList.remove("on");
    State.powered=true;
    UI.init();
    if(!FX.init()){
      UI.err("VIDEO CIRCUIT","THIS BROWSER CANNOT RUN THE VIDEO PROCESSOR",
             "WebGL is unavailable here. Try another browser, or switch off low-power mode and reload.");
      return;
    }
    if(!Rec.supported()){
      State.recSupported=false;
      $("#btnRec").setAttribute("disabled","");
      UI.warn("REC N/A",0,"amber");
    }
    this.watchBattery();
    await this.startCam();
    if(!this.running){ this.running=true; this.last=performance.now(); requestAnimationFrame(t=>this.loop(t)); }
  },

  async startCam(){
    UI.clearErr();
    try{
      await Cam.start(State.facing);
      State.ready=true;
      Cam.applyWB(); Cam.applyExposure();
      if(S.mic && !State.micOK) UI.warn("MIC OFF",5000,"amber"); else UI.unwarn("MIC OFF");
      UI.resize();
    }catch(e){
      State.ready=false;
      const n=(e&&e.name)||"";
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        UI.err("UNSUPPORTED","THIS BROWSER HAS NO CAMERA SUPPORT",
               "Open the page in a recent Safari, Chrome or Firefox, over https.");
      }else if(n==="NotAllowedError"||n==="SecurityError"){
        UI.err("CAMERA BLOCKED","CAMERA ACCESS WAS REFUSED",
               "Allow camera access for this page in your browser settings, then press RETRY.");
      }else if(n==="NotFoundError"||n==="OverconstrainedError"){
        UI.err("NO LENS FOUND","NO USABLE CAMERA ON THIS DEVICE",
               "Connect a camera, or try the other lens, then press RETRY.");
      }else if(n==="NotReadableError"||n==="AbortError"){
        UI.err("LENS BUSY","ANOTHER APP IS USING THE CAMERA",
               "Close other apps or tabs using the camera, then press RETRY.");
      }else{
        UI.err("CAMERA ERROR","CAMERA COULD NOT START","Check camera permissions, then press RETRY.");
      }
    }
  },
  async restartCam(){ State.quality=S.quality; State.ready=false; await this.startCam(); },
  async flip(){
    if(State.recording){ UI.warn("STOP THE TAPE FIRST",1800,"amber"); return; }
    const sc=$("#screen");
    sc.style.transition="opacity .13s linear"; sc.style.opacity="0.12";
    this.track=1; this.trackY=Math.random();
    State.facing = State.facing==="user" ? "environment" : "user";
    await this.startCam();
    setTimeout(()=>{ sc.style.opacity="1"; setTimeout(()=>{ sc.style.transition=""; },220); },90);
    UI.flash(State.facing==="user"?"FRONT":"REAR");
    Beep.click();
  },

  watchBattery(){
    if(navigator.getBattery){
      navigator.getBattery().then(b=>{
        State.batteryReal=true;
        const up=()=>{ State.battery=b.level; };
        up(); b.addEventListener("levelchange",up); b.addEventListener("chargingchange",up);
      }).catch(()=>{});
    }
  },

  buildGateCanvas(){
    if(!UI.W || !UI.H) return null;
    const c=document.createElement("canvas");
    c.width=UI.H; c.height=UI.W;   // swapped: landscape, full frame, no crop
    return c;
  },
  toggleRec(){
    if(State.mode!=="cam"||!State.ready) return;
    if(!State.recSupported){ UI.warn("RECORDER N/A",2000,"amber"); Beep.err(); return; }
    if(State.recording){
      State.recording=false; body.classList.remove("recording");
      State.tapeUsed += State.recElapsed;
      Rec.stop(); Beep.stop();
      this.track=0.9; this.trackY=rnd(0.2,0.8);
      UI.flash("STANDBY");
      $("#btnRec").setAttribute("aria-label","Start recording");
    }else{
      let recSrc = UI.out;
      if(S.shoot===1){
        this.gateCanvas = this.buildGateCanvas();
        this.gateCtx = this.gateCanvas ? this.gateCanvas.getContext("2d",{alpha:false}) : null;
        if(this.gateCanvas) recSrc = this.gateCanvas;
      }
      Rec.usedGate = (recSrc !== UI.out);
      if(!Rec.start(recSrc)){
        UI.err("RECORDER FAULT","THE TAPE COULD NOT START",
               "This browser would not record from the picture canvas. Stills still work.");
        return;
      }
      State.recording=true; State.recElapsed=0; State.recStart=performance.now();
      body.classList.add("recording"); Beep.start();
      this.track=0.8; this.trackY=rnd(0.2,0.8);
      $("#btnRec").setAttribute("aria-label","Stop recording");
    }
  },
  abortRec(){
    if(!State.recording) return;
    State.recording=false; body.classList.remove("recording");
    State.tapeUsed+=State.recElapsed;
    try{ Rec.stop(); }catch(e){}
  },

  photo(){
    if(State.mode!=="cam"||!State.ready) return;
    const c=document.createElement("canvas");
    c.width=UI.out.width; c.height=UI.out.height;
    c.getContext("2d").drawImage(UI.out,0,0);
    c.toBlob(b=>{
      if(!b){ UI.warn("STILL FAILED",1800,"amber"); return; }
      Play.add({ kind:"photo", blob:b, url:URL.createObjectURL(b), dur:0,
                 at:new Date(), thumb:UI.grabThumb(), ext:"jpg" });
      UI.flash("PHOTO");
    },"image/jpeg",0.9);
    const sc=$("#screen");
    sc.style.filter="brightness(1.75) contrast(.85)";
    setTimeout(()=>{ sc.style.filter=""; },70);
    this.track=0.6; this.trackY=rnd(0.3,0.7);
    Beep.tone(1800,0.05,0.02);
  },

  loop(now){
    requestAnimationFrame(t=>this.loop(t));
    const dt=Math.min(0.05,(now-this.last)/1000||0.016);
    this.last=now;
    if(!this.t0) this.t0=now;

    this.frames++;
    if(now-this.fpsT>700){
      State.fps=this.frames*1000/(now-this.fpsT); this.frames=0; this.fpsT=now;
      if(State.fps<24 && !State.recording && State.quality===1){
        if(++this.slow>=3){ State.quality=0; UI.resize(); this.slow=0; }
      }else this.slow=0;
    }

    if(!State.recording && now-State.lastTouch>22000){
      if(!State.idle){ State.idle=true; body.classList.add("idle"); }
    }else if(State.idle){ State.idle=false; body.classList.remove("idle"); }

    if(!State.batteryReal){
      State.batterySim = clamp(State.batterySim - (State.recording?0.00022:0.00008)*dt*60, 0.04, 1);
      State.battery = State.batterySim;
    }

    if(Zoom.update(dt)){ UI.syncZoom(); UI.showZoom(); }

    if(now>this.nextTrack){                     // rare, short tracking errors
      this.nextTrack = now + rnd(4200,13000);
      this.track = rnd(0.35,1.0); this.trackY = Math.random();
    }
    if(this.track>0) this.track = Math.max(0, this.track - dt*rnd(1.4,2.6));

    if(State.recording){
      State.recElapsed=(now-State.recStart)/1000;
      if(State.tapeUsed+State.recElapsed>=State.tapeLen){ this.toggleRec(); UI.warn("TAPE END",5000,"amber"); }
    }

    if(State.mode==="cam"){
      if(State.ready && FX.ok && UI.ctx){
        this.field = this.field?0:1;
        const mirror = (State.facing==="user") && !!S.mirrorFront;
        if(FX.draw(Cam.video, UI.W, UI.H, (now-this.t0)/1000, Zoom.x, mirror, this.field, this.track, this.trackY)){
          UI.ctx.drawImage(FX.canvas,0,0,UI.W,UI.H);
          OSD.draw(UI.ctx, UI.W, UI.H, now);
          if(State.recording && S.shoot===1 && this.gateCanvas && this.gateCtx){
            const gw=this.gateCanvas.width, gh=this.gateCanvas.height;
            this.gateCtx.save();
            this.gateCtx.translate(gw,0);
            this.gateCtx.rotate(Math.PI/2);
            this.gateCtx.drawImage(FX.canvas,0,0,UI.W,UI.H);
            this.gateCtx.restore();
            OSD.draw(this.gateCtx, gw, gh, now);
          }
        }
      }
    }else if(State.shuttle<0){                  // rewind, stepped by hand
      const v=$("#pbvid");
      if(v.duration){ v.currentTime=Math.max(0,v.currentTime-dt*5); if(v.currentTime<=0) Play.shuttleEnd(); }
    }
  }
};

/* ============================ wiring ================================== */
function press(el,onDown,onUp){
  let down=false;
  const d=e=>{ if(down) return; down=true; el.classList.add("dn"); State.lastTouch=performance.now(); onDown&&onDown(e); };
  const u=()=>{ if(!down) return; down=false; el.classList.remove("dn"); onUp&&onUp(); };
  el.addEventListener("touchstart",e=>{ e.preventDefault(); d(e); },{passive:false});
  el.addEventListener("touchend",e=>{ e.preventDefault(); u(); },{passive:false});
  el.addEventListener("touchcancel",u);
  el.addEventListener("mousedown",d);
  el.addEventListener("mouseleave",u);
  window.addEventListener("mouseup",u);
  el.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); d(e); } });
  el.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); u(); } });
}

(function wire(){
  $("#btnPower").addEventListener("click",()=>{ Beep.init(); Beep.tone(660,0.1,0.03); App.boot(); },{once:true});
  $("#boot").addEventListener("click",e=>{ if(!(e.target.closest && e.target.closest("#btnPower"))) App.skipBoot=true; });

  const rocker=$("#rocker");
  press($("#zIn"), ()=>{ Zoom.press(1); rocker.classList.add("tt"); UI.showZoom(); },
                   ()=>{ Zoom.release(); rocker.classList.remove("tt"); });
  press($("#zOut"),()=>{ Zoom.press(-1); rocker.classList.add("tw"); UI.showZoom(); },
                   ()=>{ Zoom.release(); rocker.classList.remove("tw"); });

  $("#btnRec").addEventListener("click",()=>{ State.lastTouch=performance.now(); App.toggleRec(); });
  $("#btnPhoto").addEventListener("click",()=>{ State.lastTouch=performance.now(); App.photo(); });
  $("#btnFlip").addEventListener("click",()=>{ State.lastTouch=performance.now(); App.flip(); });
  $("#btnMenu").addEventListener("click",()=>{ State.lastTouch=performance.now(); Menu.open(); });

  [["#swCam","cam"],["#swPlay","play"],["#swCam2","cam"],["#swPlay2","play"]]
    .forEach(([s,m])=>$(s).addEventListener("click",()=>UI.setMode(m)));

  $("#sessionPill").addEventListener("click",()=>{ State.lastTouch=performance.now(); Session.open(); });
  $("#sessClose").addEventListener("click",()=>Session.close());
  $("#sessSaveAll").addEventListener("click",()=>Session.saveAll());

  $("#tPlay").addEventListener("click",()=>{ Play.toggle(); Beep.click(); });
  $("#tStop").addEventListener("click",()=>{ Play.stop(); Beep.click(); });
  press($("#tFF"), ()=>Play.shuttle(1), ()=>Play.shuttleEnd());
  press($("#tRew"),()=>Play.shuttle(-1),()=>Play.shuttleEnd());
  $("#tIndex").addEventListener("click",()=>{ body.classList.toggle("browsing"); Play.renderIndex(); Beep.click(); });
  $("#tSave").addEventListener("click",()=>{ Play.save(); Beep.click(); });
  $("#tDel").addEventListener("click",()=>{ Play.erase(); Beep.click(); });
  $("#pbvid").addEventListener("ended",()=>{ State.playing=false; UI.syncTransport(); UI.flash("END"); });

  $("#mUp").addEventListener("click",()=>Menu.move(-1));
  $("#mDown").addEventListener("click",()=>Menu.move(1));
  $("#mPrev").addEventListener("click",()=>Menu.adjust(-1));
  $("#mNext").addEventListener("click",()=>Menu.adjust(1));
  $("#mExit").addEventListener("click",()=>Menu.close());

  $("#errRetry").addEventListener("click",()=>{ UI.clearErr(); App.restartCam(); });
  $("#errPlay").addEventListener("click",()=>{ UI.clearErr(); UI.setMode("play"); });

  const screen=$("#screen");
  let pinch0=0, pinchL=0, moved=false, downAt=0, x0=0, y0=0;
  screen.addEventListener("touchstart",e=>{
    State.lastTouch=performance.now();
    if(e.touches.length===2){
      pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchL=Zoom.L; moved=true;
    }else if(e.touches.length===1){
      downAt=performance.now(); moved=false; x0=e.touches[0].clientX; y0=e.touches[0].clientY;
    }
  },{passive:true});
  screen.addEventListener("touchmove",e=>{
    if(e.touches.length===2 && pinch0){
      e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      Zoom.pinch(pinchL + Math.log(Math.max(0.2,d/pinch0))/Math.LN2*1.1);
      UI.showZoom(); UI.syncZoom();
    }else if(e.touches.length===1){
      if(Math.hypot(e.touches[0].clientX-x0, e.touches[0].clientY-y0)>12) moved=true;
    }
  },{passive:false});
  screen.addEventListener("touchend",async e=>{
    if(pinch0 && e.touches.length===0){ pinch0=0; return; }
    if(moved || body.classList.contains("menu-open") || State.mode!=="cam" || !State.ready) return;
    if(performance.now()-downAt>700) return;
    const r=screen.getBoundingClientRect();
    const x=x0-r.left, y=y0-r.top;
    if(x<0||y<0||x>r.width||y>r.height) return;
    const locked=await Cam.focusAt(clamp(x/r.width,0,1), clamp(y/r.height,0,1));
    UI.reticle(x,y,locked); Beep.tone(2100,0.02,0.008);
  },{passive:true});
  screen.addEventListener("click",async e=>{
    if("ontouchstart" in window) return;
    if(body.classList.contains("menu-open")||State.mode!=="cam"||!State.ready) return;
    const r=screen.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    const locked=await Cam.focusAt(clamp(x/r.width,0,1), clamp(y/r.height,0,1));
    UI.reticle(x,y,locked);
  });
  screen.addEventListener("wheel",e=>{
    if(State.mode!=="cam") return;
    e.preventDefault();
    Zoom.pinch(clamp(Zoom.L - Math.sign(e.deltaY)*0.09, Zoom.minL, Zoom.maxL));
    UI.showZoom(); UI.syncZoom();
  },{passive:false});

  window.addEventListener("keydown",e=>{
    if(body.classList.contains("menu-open")){
      if(e.key==="ArrowUp"){ e.preventDefault(); Menu.move(-1); }
      else if(e.key==="ArrowDown"){ e.preventDefault(); Menu.move(1); }
      else if(e.key==="ArrowLeft"){ e.preventDefault(); Menu.adjust(-1); }
      else if(e.key==="ArrowRight"){ e.preventDefault(); Menu.adjust(1); }
      else if(e.key==="Escape") Menu.close();
      return;
    }
    if(e.key==="r"||e.key==="R") App.toggleRec();
    else if(e.key==="m"||e.key==="M") Menu.open();
    else if(e.key==="f"||e.key==="F") App.flip();
    else if(e.key==="p"||e.key==="P") App.photo();
    else if(e.key==="ArrowUp"){ e.preventDefault(); Zoom.press(1); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); Zoom.press(-1); }
  });
  window.addEventListener("keyup",e=>{ if(e.key==="ArrowUp"||e.key==="ArrowDown") Zoom.release(); });

  let rt;
  window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>UI.resize(),140); });
  window.addEventListener("orientationchange",()=>{ setTimeout(()=>UI.resize(),340); });
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(State.recording) App.toggleRec();
      Beep.motorOff(); Zoom.release();
    }else if(State.powered && State.mode==="cam" && Cam.video && Cam.video.paused){
      Cam.video.play().catch(()=>{});
    }
  });
  window.addEventListener("pagehide",()=>{ Cam.stop(); });
})();
</script>
</body>
</html>
